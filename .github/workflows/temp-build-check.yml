# TEMPORARY: build check for this PR only (there is no permanent CI yet).
# Drop this commit before merging.
name: Temp build check

on:
  push:
    branches: [ "fix/apple-signin-completion-and-swipe-dismiss" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [ FirebaseAuthUI, FirebaseOAuthUI, FirebasePhoneAuthUI, FirebaseEmailAuthUI ]
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build ${{ matrix.scheme }} for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ${{ matrix.scheme }} \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
